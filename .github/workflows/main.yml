
name: Build Quotex Signal AI Demo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'QuotexSignalAI_Demo_Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q QuotexSignalAI_Demo_Project.zip -d project

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "    buildFeatures { compose = true }",
              """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }"""
          )
          p.write_text(s)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuotexSignalAI-Demo-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
